name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: sintaxis
        run: for f in *.js; do node --check "$f"; done
      - name: pruebas puras
        run: node prueba.js

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: vistas y formulario en Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node prueba-navegador.js
